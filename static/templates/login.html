<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://kit.fontawesome.com/02280d45a5.js" crossorigin="anonymous"></script>
    <title>Login Page</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #f0e2e2;
            --secondary-color: #FFD6E0;
            --accent-color: #FFBEFB;
            --text-color: #000;
            --btn-hover-color: #DC95FF;
            --bgcolor: #ffff;
            --font-primary: 'Outfit', sans-serif;
            --font-secondary: 'DM Serif Display', serif;
        }

        body {
            overflow-x: hidden;
            background-color: var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
        }

        .login-container {
            background-color: var(--bgcolor);
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        .login-container h2 {
            margin-top: 10px;
            font-family: var(--font-secondary);
            font-size: 30px;
            margin-bottom: 10px;
        }

        .login-container span {
            font-family: var(--font-primary);
            font-size: 18px;
            margin-bottom: 20px;
        }

        .login-container form {
            justify-content: center;
            align-items: center;
        }

        .login-container form input {
            width: 330px;
            padding: 10px;
            margin: 14px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            border: none;
        }

        .login-container form input:focus {
            outline: none;
            border-bottom: 2px solid var(--accent-color);
        }

        .login-container form .password {
            display: flex;
            position: relative;
        }

        .login-container form .password i {
            background-color: transparent;
            position: absolute;
            size: 20px;
            right: 0;
            bottom: 25px;
            cursor: pointer;
        }

        .login-container form .checkbox {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 16px;
        }

        .login-container form .checkbox input {
            width: 20px;
            height: 20px;
        }

        .login-container button {
            width: 130px;
            font-weight: 600;
            font-size: 16px;
            text-transform: uppercase;
            padding: 10px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            background-color: var(--accent-color);
            cursor: pointer;
            filter: drop-shadow(3px 3px 6px var(--accent-color));
        }

        .login-container button:active {
            background-color: var(--btn-hover-color);
            filter: drop-shadow(0px 0px 0px var(--btn-hover-color));

        }

        .login-container #errorMessage {
            color: red;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h2>Login Form</h2>
        <span>Stock & Inventory management system</span>
        <form action="#" id="form">
            <div class="input">
                <input id="user" type="text" placeholder="username / Email" />
                <div class="password">
                    <input type="password" id="password" placeholder="password" />
                    <i id="eye" class="fa-regular fa-eye"></i>
                </div>
            </div>
            <div class="checkbox">
                <input type="checkbox" /> <label for="#">Remember me</label>
            </div>
            <button type="submit">Submit</button>

            <p id="errorMessage"></p>
            <p>Don't have an account <a href="/signup">Create One</a></p>
        </form>
    </div>

    <script>
        let form = document.getElementById("form");
        let eye = document.getElementById("eye");
        let password = document.getElementById("password");
        let user = document.getElementById("user");
        let errorMessage = document.getElementById("errorMessage");

        eye.addEventListener("click", () => {
            if (password.type === "password") {
                password.type = "text";
                eye.classList.remove("fa-eye");
                eye.classList.add("fa-eye-slash");
            } else {
                password.type = "password";
                eye.classList.remove("fa-eye-slash");
                eye.classList.add("fa-eye");
            }
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (user.value.trim() === "" || password.value.trim() === "") {
                errorMessage.innerHTML = "Invalid username/password";
                return;
            }

            if (user.value.includes("@") && !user.value.includes(".")) {
                errorMessage.innerHTML = "invalid email";
                return;
            }

            // authentication
            let loginData = {
                username: user.value,
                password: password.value,
            };

            // sends request to flask
            let response = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify(loginData),
            });

            let data = await response.json();

            if (data.success) {
                errorMessage.style.color = "green";
                errorMessage.innerHTML = data.message;
                form.reset();

                window.location.href = "/dashboard";
            } else {
                errorMessage.style.color = "red";
                errorMessage.innerHTML = data.message;
            }
        });
    </script>
</body>

</html>
