<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-Up SIMS</title>

  <style>
     @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@100..900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    :root{
        --primary-color: #f0e2e2;
        --secondary-color: #FFD6E0;
        --accent-color: #FFBEFB;
        --text-color: #000;
        --btn-hover-color: #DC95FF;
        --bgcolor: #ffff;
        --font-primary: 'Outfit', sans-serif;
        --font-secondary: 'DM Serif Display', serif;
    }
   body{
        overflow-x: hidden;
        background-color: var(--primary-color);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;  
        width: 100%;
    }
    .login-container{
        background-color: var(--bgcolor);
        padding: 20px;
        text-align: center;
        border-radius: 10px;
    }
    .login-container h2{
        margin-top: 10px;
        font-family: var(--font-secondary);
        font-size: 30px;
        margin-bottom: 10px;
    }
    .login-container span{
        font-family: var(--font-primary);
        font-size: 18px;
        margin-bottom: 20px;
    }
    .login-container form{
        justify-content: center;
        align-items: center;
    }
    .login-container form input{
        width: 330px;
        padding: 10px;
        margin: 14px ;
        border-radius: 5px;
        display: flex;
        flex-direction: column;
        border:none;
    }
    .login-container form input:focus{
        outline: none;
        border-bottom: 2px solid var(--accent-color);
    }
    .login-container form .password{
        display: flex;
        position: relative;
    }
    .login-container form .password i{
        background-color: transparent;
        position: absolute;
        size: 20px;
        right: 0;
        bottom: 25px;
        cursor: pointer;
    }
    .login-container form .checkbox{
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 16px;
    }
    .login-container form .checkbox input{
        width: 20px;
        height: 20px;
    }
    .login-container  button{
        width: 130px;
        font-weight: 600;
        font-size: 16px;
        text-transform: uppercase;
        padding: 10px;
        margin: 10px ;
        border: none;
        border-radius: 5px;
        background-color: var(--accent-color);
        cursor: pointer;
        filter: drop-shadow(3px 3px 6px var(--accent-color));
    }
    .login-container button:active{
        background-color: var(--btn-hover-color);
        filter: drop-shadow(0px 0px 0px var(--btn-hover-color));

    }
    .login-container #errorMessage{
        color: red;
    }

    .password_req {
      text-align: left;
    }
    .password_req span {
      color: red;
    }
  </style>
  <body>
    <div class="login-container">
      <h2>Sign-Up Form</h2>
      <span>Stock & Inventory management system</span>
      <form action="#" id="form">
        <input id="username" type="text" placeholder="Username" />
        <input id="name" type="text" placeholder="Full Name" />
        <input id="email" type="email" placeholder="Email" />
        <input id="phone" type="tel" placeholder="Phone" />
        <input id="password" type="password" placeholder="Password" />

        <div class="password_req">
          <span id="lengthcheck">x length must be >7</span><br />
          <span id="lettercheck">x atleast 1 letter</span><br />
          <span id="digitcheck">x atleast 1 digit</span><br />
          <span id="specialchar">x atleast 1 special character</span><br />
        </div>
        <input
          id="confirm-password"
          type="text"
          placeholder="Confirm Password"
        />
        <div class="checkbox">
          <input type="checkbox" id="check" />
          <label for="#">agree with Terms and Conditions</label>
        </div>
        <button type="submit">Submit</button>

        <p id="errorMessage"></p>
        <p>Already have an account <a href="/login">Login Now</a></p>
      </form>
    </div>

    <script>
      let form = document.getElementById("form");
      let user = document.getElementById("username");
      let name = document.getElementById("name");
      let email = document.getElementById("email");
      let password = document.getElementById("password");
      let phone = document.getElementById("phone");
      let confirm_password = document.getElementById("confirm-password");
      let errorMessage = document.getElementById("errorMessage");
      let check = document.getElementById("check");

      let length = document.getElementById("lengthcheck");
      let letter = document.getElementById("lettercheck");
      let digit = document.getElementById("digitcheck");
      let special = document.getElementById("specialchar");

      password.addEventListener("input", function () {
        let value = password.value;
        if (value.length > 7) {
          length.style.color = "green";
        }
        if (/[a-zA-Z]/.test(value)) {
          letter.style.color = "green";
        }
        if (/[0-9]/.test(value)) {
          digit.style.color = "green";
        }
        if (/[^a-zA-Z,0-9]/.test(value)) {
          special.style.color = "green";
        }
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        errorMessage.innerHTML = "";

        if (
          user.value == "" ||
          name.value == "" ||
          email.value == "" ||
          password.value == "" ||
          confirm_password.value == ""
        ) {
          errorMessage.innerHTML =
            "invalid Entities fill out all the required fields";
        }
        if (password.value < 7) {
          length.innerHTML = "password must be > 7 chracters";
        }
        if (password.value != confirm_password.value) {
          errorMessage.innerHTML = "passwords dont match";
        }

        if (check.checked == false) {
          errorMessage.innerHTML = "check the terms and conditions";
        }

        // authentication
        let signupData = {
          fullname: name.value,
          username: user.value,
          email: email.value,
          phone: phone.value,
          password: password.value,
        };

        // sends request to flask
        let response = await fetch("/signup", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(signupData),
        });

        let data = await response.json();

        if (data.success) {
          errorMessage.style.color = "green";
          errorMessage.innerHTML = data.message;
          form.reset();

          setTimeout(function () {
            window.location.href = "/login";
          }, 1000);
        } else {
          errorMessage.style.color = "red";
          errorMessage.innerHTML = data.message;
        }
      });
    </script>
  </body>
</html>
